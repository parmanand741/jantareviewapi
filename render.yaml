# Render Blueprint — JantaReview API (CodeIgniter 4 on PHP 8.2 + Apache)
# Deploy: create a Blueprint from the connected GitHub repo, or create a Web
# Service and point it at this Dockerfile. Secrets (sync:false) are entered once
# in the Render dashboard and are NOT stored in this file/repo.
services:
  - type: web
    name: jantareview-api
    runtime: docker
    plan: free
    # singapore = lowest latency to Indian users. If the free plan rejects it,
    # switch to 'oregon' in the dashboard.
    region: singapore
    dockerfilePath: ./Dockerfile
    # NOTE: do NOT set a health-check path. Render probes it with HEAD, and the
    # CI4 route for '/' only accepts GET, so HEAD returns 404 and the check fails.
    # healthCheckPath: /
    # Single instance: file-based sessions/OTP live in writable/ and are not
    # shared across replicas. Add a Disk (paid) mounted at /app/writable to make
    # them durable across deploys/restarts.
    envVars:
      # ---- Non-secret configuration -------------------------------------
      # production keeps stack traces and .env dumps out of HTTP responses.
      # With CI_ENVIRONMENT=development the API leaks its own source on any
      # uncaught error, which is why this is pinned here rather than left to
      # the dashboard value.
      - key: CI_ENVIRONMENT
        value: production

      - key: REVIEW_SPREADSHEET_ID
        value: 16kx-SLOOTe8tpMa8gZcZ8UeQVMIxGkxsnwQ4y9jDPgg
      - key: REVIEW_ALLOWED_ORIGINS
        value: https://jantareview.vercel.app
      - key: REVIEW_TURNSTILE_HOSTS
        value: jantareview.vercel.app

      # Cross-site cookies: frontend (vercel.app) != API (onrender.com), so
      # SameSite=None + Secure is mandatory. Do not change these.
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: None

      # Keep false. Render terminates TLS at its edge and forwards plain HTTP to
      # the container; App::$proxyIPs now trusts loopback so CI4 can see the real
      # scheme via X-Forwarded-Proto, but the ForceHTTPS filter would only add a
      # redirect hop for traffic that already arrives over TLS from the browser.
      - key: APP_FORCE_HTTPS
        value: "false"

      - key: TURNSTILE_USE_TEST_KEYS
        value: "false"
      - key: TURNSTILE_BYPASS_FOR_LOCAL_DEV
        value: "false"
      - key: REVIEW_EXPOSE_ERRORS
        value: "false"

      # ---- Abuse-prevention tuning (all optional; these are the defaults) --
      # Changing REVIEW_IDENTITY_PEPPER re-keys every stored submitter token,
      # so past votes/reports stop matching the devices that filed them. Set it
      # once, before launch, and leave it alone. Empty means "derive from
      # REVIEW_ENCRYPTION_KEY".
      - key: REVIEW_VOTE_USER_COOLDOWN_SECONDS
        value: "300"
      - key: REVIEW_REPORT_TIER_FREE
        value: "5"
      - key: REVIEW_REPORT_TIER_SLOW
        value: "1"
      - key: REVIEW_REPORT_TIER_SLOW_SECONDS
        value: "18000"
      - key: REVIEW_RESCUE_HYSTERESIS_STEP
        value: "2"
      - key: REVIEW_READ_PER_MINUTE
        value: "120"
      - key: REVIEW_OTP_PER_IP_PER_DAY
        value: "20"
      - key: REVIEW_TICKET_MIN_AGE_SECONDS
        value: "3"
      - key: REVIEW_QUARANTINE_SECONDS
        value: "1800"
      - key: REVIEW_DEDUPE_WINDOW_SECONDS
        value: "86400"
      # Site-wide ceilings per hour, as scope=N pairs. 0 disables one.
      - key: REVIEW_GLOBAL_CAPS
        value: "submit=300,vote=3000,report=600,urlcheck=600,suggestion=300,grievance=200,otp=400"
      - key: REVIEW_GRIEVANCE_PER_HOUR
        value: "3"
      # Rows purged from the audit log; content archive purges at
      # REVIEW_RETENTION_DAYS.
      - key: REVIEW_AUDIT_RETENTION_DAYS
        value: "180"
      # Comma-separated client IPs allowed to reach the admin panel. Empty
      # means no IP restriction (only the key, the idle TTL and the step-up
      # key apply).
      - key: REVIEW_ADMIN_ALLOWED_IPS
        value: ""
      - key: REVIEW_ADMIN_TTL_SECONDS
        value: "1800"
      # Sends the grievance acknowledgement mail. Off until the officer
      # identity below stops being a placeholder.
      - key: GRIEVANCE_NOTIFY_ENABLED
        value: "false"

      # ---- OTP / Mailjet (non-secret parts) ------------------------------
      - key: OTP_FROM_EMAIL
        value: noreply.jantareview@gmail.com
      - key: OTP_FROM_NAME
        value: JantaReview
      - key: OTP_TTL_SECONDS
        value: "600"
      - key: OTP_MAX_ATTEMPTS
        value: "3"
      - key: OTP_REQUESTS_PER_DAY
        value: "3"

      # ---- Grievance Officer (public via ?action=compliance) ------------
      # TODO: replace these placeholders with the real, legally-required details
      # before going live (IT (Intermediary Guidelines) Rules, 2021).
      - key: GRIEVANCE_OFFICER_NAME
        value: Test Grievance Officer
      - key: GRIEVANCE_OFFICER_EMAIL
        value: test@example.com
      - key: GRIEVANCE_OFFICER_PHONE
        value: +91-0000000000
      - key: GRIEVANCE_OFFICER_ADDRESS
        value: Test Address
      - key: GRIEVANCE_ACK_SLA_HOURS
        value: "24"
      - key: GRIEVANCE_RESOLVE_SLA_DAYS
        value: "15"
      - key: GRIEVANCE_PRIORITY_TAKEDOWN_HOURS
        value: "36"

      # ---- Secrets: enter in the Render dashboard (never committed) -----
      - key: GOOGLE_SERVICE_ACCOUNT_JSON_BASE64
        sync: false
      - key: REVIEW_ENCRYPTION_KEY
        sync: false
      - key: REVIEW_IDENTITY_PEPPER
        sync: false
      - key: REVIEW_ADMIN_KEY
        sync: false
      - key: TURNSTILE_SECRET
        sync: false
      - key: MAILJET_API_KEY
        sync: false
      - key: MAILJET_SECRET_KEY
        sync: false
