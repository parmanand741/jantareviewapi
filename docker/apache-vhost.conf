<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /app/public

    <Directory /app/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Deny direct web access to the rest of the project (app/, writable/, vendor/).
    <Directory /app>
        Require all denied
    </Directory>
    <Directory /app/public>
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
